org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# Paths filled in by `build_android.sh` (can be overridden with -P on the command line).
# Blender install prefix produced by `cmake --install` for Android (contains libmain.so and <version>/).
blender.installDir=../../../build_android/install
# SDL3 source tree, its Java glue (android-project/app/src/main/java) is compiled into the APK.
sdl.sourceDir=../../../lib/android_src/SDL3
# Blender version directory name inside the install prefix.
blender.version=5.4
