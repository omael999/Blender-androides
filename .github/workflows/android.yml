# Builds the Android port: dependencies (cached), Blender (libmain.so) and the APK.
# See build_files/android/README.md.

name: Android build

on:
  push:
    branches: [android-port]
  workflow_dispatch:
    inputs:
      rebuild_deps:
        description: "Ignore the dependency cache and rebuild everything"
        type: boolean
        default: false

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  ANDROID_ABI: arm64-v8a
  ANDROID_API: "29"
  # libc++ 19+ is needed (std::atomic_ref), the newest NDK of this major is resolved below.
  NDK_MAJOR: "29"
  LIBDIR: ${{ github.workspace }}/lib/android_arm64-v8a

jobs:
  deps:
    name: Dependencies (NDK)
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    outputs:
      cache-key: ${{ steps.key.outputs.key }}
      ndk-version: ${{ steps.ndk.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Resolve NDK version
        id: ndk
        run: |
          v=$("$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list 2>/dev/null \
            | sed -n "s/^ *ndk;\(${NDK_MAJOR}\.[0-9.]*\) .*/\1/p" | sort -uV | tail -1)
          test -n "$v"
          echo "NDK $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "NDK_VERSION=$v" >> "$GITHUB_ENV"

      - name: Cache key
        id: key
        run: |
          echo "key=android-deps-${ANDROID_ABI}-${NDK_VERSION}-${{ hashFiles(
            'build_files/build_environment/cmake/versions.cmake',
            'build_files/build_environment/android/build_deps_android.sh') }}" >> "$GITHUB_OUTPUT"

      - name: Restore dependency cache
        id: cache
        if: ${{ !inputs.rebuild_deps }}
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/android_arm64-v8a
            lib/android_src
          key: ${{ steps.key.outputs.key }}
          # A previous cache is reused, build_deps_android.sh only builds what is missing.
          restore-keys: android-deps-${{ env.ANDROID_ABI }}-${{ env.NDK_VERSION }}-

      - name: Free disk space
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Host tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build meson rsync patch

      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          python-version: "3.13"

      - name: Install NDK
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          JOBS=$(nproc) WORK_DIR="$RUNNER_TEMP/deps" \
            ./build_files/build_environment/android/build_deps_android.sh 2>&1 | tee deps.log
          # SDL's source is a symlink into WORK_DIR, keep a real copy for the cache.
          if [ -L lib/android_src/SDL3 ]; then
            cp -rL lib/android_src/SDL3 lib/android_src/SDL3.real
            rm lib/android_src/SDL3 && mv lib/android_src/SDL3.real lib/android_src/SDL3
          fi

      - name: Save dependency cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/android_arm64-v8a
            lib/android_src
          key: ${{ steps.key.outputs.key }}

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deps-log
          path: deps.log

  blender:
    name: Blender + APK
    needs: deps
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: write  # Publish the APK as the `android-latest` pre-release.
    env:
      NDK_VERSION: ${{ needs.deps.outputs.ndk-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: LFS cache key
        id: lfs
        run: |
          key=$(git lfs ls-files -l -I "release/datafiles/**,assets/**,scripts/startup/**" | sha256sum | cut -c1-32)
          echo "key=blender-lfs-$key" >> "$GITHUB_OUTPUT"

      - name: Restore LFS objects
        id: lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}
          restore-keys: blender-lfs-

      - name: Fetch Git LFS data files
        # Blender keeps startup.blend, icons, studio lights etc. in Git LFS on
        # projects.blender.org; forks on GitHub only contain the pointer files.
        run: |
          git lfs checkout "release/datafiles/**" "assets/**" "scripts/startup/**" || true
          ./build_files/android/fetch_lfs.sh

      - name: Save LFS objects
        if: steps.lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .git/lfs/objects
          key: ${{ steps.lfs.outputs.key }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/node_modules /opt/ghc /usr/local/.ghcup \
            /usr/share/swift /usr/local/share/powershell /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Restore dependency cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/android_arm64-v8a
            lib/android_src
          key: ${{ needs.deps.outputs.cache-key }}
          fail-on-cache-miss: true

      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build rsync ccache gcc-14 g++-14 patchelf \
            libjpeg-dev libpng-dev zlib1g-dev libzstd-dev libepoxy-dev libfmt-dev \
            libfreetype-dev libbrotli-dev libimath-dev libopenexr-dev libopenimageio-dev openimageio-tools \
            libeigen3-dev libtbb-dev libvulkan-dev libshaderc-dev libyaml-cpp-dev \
            libexpat1-dev pkg-config
          # Ubuntu's OpenImageIOTargets.cmake lists this include dir even without OpenCV.
          sudo mkdir -p /usr/include/opencv4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14"
          # SDL3's sample project (restored from the deps cache) ships its own wrapper jar,
          # which is not used: the APK is built with the Gradle installed here.
          validate-wrappers: false
          # Cache Gradle dependencies from this branch too (default: only the default branch),
          # Maven Central may rate-limit (HTTP 429) repeated downloads from CI.
          cache-read-only: false

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: android-ccache-${{ github.sha }}
          restore-keys: android-ccache-

      - name: Build Blender and APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_MAXSIZE: 6G
        run: |
          set -o pipefail
          BUILD_DIR="$RUNNER_TEMP/build_android" JOBS=$(nproc) \
            ./build_files/android/build_android.sh --skip-deps 2>&1 | tee blender.log

      # Saved even when the build fails, so the next attempt only recompiles what changed.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: android-ccache-${{ github.sha }}-${{ github.run_attempt }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: blender-android-${{ env.ANDROID_ABI }}
          path: build_files/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APK (pre-release "android-latest")
        # A direct .apk download link, easier to install from a phone than the artifact zip.
        if: success() && github.ref == 'refs/heads/android-port'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=$(find build_files/android/app/build/outputs/apk -name '*.apk' | head -1)
          cp "$apk" blender-android-arm64.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest blender-android-arm64.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Blender Android (arm64) build ${{ github.run_number }}" \
            --notes "Unofficial, experimental Android port of Blender (branch android-port, commit ${{ github.sha }}). Requires Android 10+ and a Vulkan 1.1+ GPU (e.g. Adreno). Debug-signed. Not tested on devices yet."

      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blender-log
          path: blender.log
